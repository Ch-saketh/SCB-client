<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
</head>
<body>
    <br><br>
    <center>
        <table border="1" cellpadding="20" cellspacing="0" width="380">
            <tr>
                <td>
                    <h2 align="center">Sign Up</h2>
                    <hr>
                    <form id="signupForm" onsubmit="handleSignup(event)">
                        <p>
                            <label for="username"><b>Username</b></label><br>
                            <input type="text" id="username" name="username" required size="35" placeholder="Enter username">
                        </p>
                        <p>
                            <label for="email"><b>Email</b></label><br>
                            <input type="email" id="email" name="email" required size="35" placeholder="Enter email">
                        </p>
                        <p>
                            <label for="password"><b>Password</b></label><br>
                            <input type="password" id="password" name="password" required size="35" placeholder="Enter password">
                        </p>
                        <p>
                            <label for="confirm_password"><b>Confirm Password</b></label><br>
                            <input type="password" id="confirm_password" name="confirm_password" required size="35" placeholder="Re-enter password">
                        </p>
                        <fieldset>
                            <legend><b>Role</b></legend>
                            <label>
                                <input type="radio" name="role" value="user" checked> User
                            </label>
                            &nbsp;&nbsp;&nbsp;
                            <label>
                                <input type="radio" name="role" value="admin"> Admin
                            </label>
                        </fieldset>
                        <br>
                        <center>
                            <input type="submit" value="Register">
                            &nbsp;
                            <input type="reset" value="Reset">
                        </center>
                    </form>
                    <hr>
                    <p align="center">
                        Already have an account? <a href="login.html">Log In</a>
                    </p>
                </td>
            </tr>
        </table>
    </center>

    <script>
        function handleSignup(event) {
            event.preventDefault();
            var pass = document.getElementById('password').value;
            var confirmPass = document.getElementById('confirm_password').value;

            if (pass !== confirmPass) {
                alert("Passwords do not match!");
                return;
            }

            alert("Signup successful! Redirecting to login...");
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
